# The namespace the presence release is installed into:
#
#   kubectl apply -f helm/namespace.yaml
#   helm upgrade --install presence ./helm/presence --namespace presence ...
#
# This is how the namespace is created — not `helm --create-namespace` — so
# it can be labelled, quota'd or policy-bound independently of the release.
# The namespace is deliberately NOT part of the chart either, so
# `helm uninstall` removes the workload and leaves the namespace — and the
# PersistentVolumeClaim holding the database — standing.
apiVersion: v1
kind: Namespace
metadata:
  name: presence
  labels:
    # Matches the chart's own labelling, so `kubectl get ns -l
    # app.kubernetes.io/name=presence` finds it.
    app.kubernetes.io/name: presence
