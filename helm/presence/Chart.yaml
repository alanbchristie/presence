apiVersion: v2
name: presence
description: Django app that simulates on/off presence within a daily window.
type: application

# Chart version (semver, no "v" prefix). Bump this for chart changes.
#
# appVersion is the default image tag, so it must name a tag the release
# workflow has actually published to Docker Hub — that is the newest git
# release tag, NOT the (unused, and currently stale) version in
# pyproject.toml. Bump it when a new release is published.
version: 0.1.1
appVersion: "3.0.2"

# Issue #62 targets Kubernetes v1.36 and beyond (k3s on ARM).
kubeVersion: ">=1.36.0-0"

home: https://github.com/alanbchristie/presence
sources:
- https://github.com/alanbchristie/presence
maintainers:
- name: Alan B. Christie
keywords:
- django
- presence
- home-automation
