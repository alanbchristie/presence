apiVersion: v2
name: presence
description: Django app that simulates on/off presence within a daily window.
type: application

# Chart version (semver, no "v" prefix). Bump this for chart changes — and
# only for chart changes.
#
# There is deliberately no appVersion. It would be the chart's default image
# tag, so it would have to name a tag the release workflow had actually
# published, which dragged a chart revision behind every application release
# — including fixes that touch nothing here. The operator names the image
# instead: `image.tag` is required, and the chart refuses to render without
# it.
version: 0.4.1

# Issue #62 targets Kubernetes v1.36 and beyond (k3s on ARM).
kubeVersion: ">=1.36.0-0"

home: https://github.com/alanbchristie/presence
sources:
- https://github.com/alanbchristie/presence
maintainers:
- name: Alan B. Christie
keywords:
- django
- presence
- home-automation
