{{- if not .Values.django.existingSecret }}
{{/*
Every sensitive value the release needs, in one Secret. `django.secretKey`
is mandatory: the app raises ImproperlyConfigured rather than fall back to
a publicly known key while DEBUG is off, so a release without one would
crash-loop instead of failing here at render time.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "presence.fullname" . }}-secret
  labels:
    {{- include "presence.labels" . | nindent 4 }}
type: Opaque
stringData:
  django-secret-key: {{ required "django.secretKey is required (or set django.existingSecret)" .Values.django.secretKey | quote }}
  db-password: {{ include "presence.db.password" . | quote }}
  {{- with .Values.django.superuser.password }}
  superuser-password: {{ . | quote }}
  {{- end }}
  {{- with .Values.w3w.apiKey }}
  w3w-api-key: {{ . | quote }}
  {{- end }}
{{- end }}
