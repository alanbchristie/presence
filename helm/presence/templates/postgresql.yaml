{{- if .Values.postgresql.enabled }}
{{/*
Backups (issue #73). Velero's File System Backup reads a volume file by
file while the database keeps writing, so a copy of a live PGDATA can be
torn across those files. Instead the pod carries backup hooks: Velero runs
`pg_dumpall` into a small dedicated volume, backs that volume up, and the
post-hook deletes the dump again — Velero waits for the pod's volume
backups before running post hooks, so the file cannot be removed out from
under the copy.

$dumpFile is what the two hooks agree on and what the container has to
mount, so it is defined once here.
*/}}
{{- $backup := and .Values.velero.fileSystemBackup .Values.postgresql.persistence.enabled }}
{{- $dumpVolume := "pg-dumpall-vol" }}
{{- $dumpDir := "/var/lib/postgresql/dumps" }}
{{- $dumpFile := printf "%s/backup.sql" $dumpDir }}
{{/*
A single-instance PostgreSQL for the release, equivalent to compose's `db`
service: one replica, one volume, no host exposure. Disable it
(postgresql.enabled=false) and fill in `externalDatabase` to point the app
at a server you manage.

The Service is headless because nothing needs to load-balance across a
single StatefulSet pod; the app just needs the stable in-cluster DNS name.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "presence.postgresql.fullname" . }}
  labels:
    {{- include "presence.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  clusterIP: None
  ports:
  - name: postgresql
    port: 5432
    targetPort: postgresql
    protocol: TCP
  selector:
    {{- include "presence.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "presence.postgresql.fullname" . }}
  labels:
    {{- include "presence.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "presence.postgresql.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "presence.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "presence.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
      {{/*
      Velero's File System Backup is opt-in per pod: it copies only the
      volumes this annotation names, matching them by the name the *pod*
      gives them — which for a StatefulSet is a volumeClaimTemplate's name.
      It names the dump volume alone; see the note at the top of this file
      for why the live data directory is not in the list.

      pg_dumpall reads $POSTGRES_USER rather than a rendered username: that
      env var is the only role initdb created, and the only superuser. The
      dump is --clean --if-exists so it loads into an empty cluster and over
      an existing one alike.
      */}}
      {{- if $backup }}
      annotations:
        backup.velero.io/backup-volumes: {{ $dumpVolume }}
        {{- $dump := printf "PGPASSWORD=\"$POSTGRES_PASSWORD\" pg_dumpall --username \"$POSTGRES_USER\" --clean --if-exists > %s" $dumpFile }}
        pre.hook.backup.velero.io/command: {{ list "/bin/sh" "-c" $dump | toRawJson | quote }}
        pre.hook.backup.velero.io/container: postgresql
        pre.hook.backup.velero.io/timeout: {{ .Values.velero.dump.timeout | quote }}
        {{- $remove := printf "rm -f %s" $dumpFile }}
        post.hook.backup.velero.io/command: {{ list "/bin/sh" "-c" $remove | toRawJson | quote }}
        post.hook.backup.velero.io/container: postgresql
        post.hook.backup.velero.io/timeout: {{ .Values.velero.dump.timeout | quote }}
      {{- end }}
    spec:
      {{- with (include "presence.scheduling" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
      - name: postgresql
        image: {{ printf "%s:%s" .Values.postgresql.image.repository .Values.postgresql.image.tag | quote }}
        imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
        env:
        - name: POSTGRES_DB
          value: {{ .Values.postgresql.database | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.postgresql.username | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "presence.secretName" . }}
              key: db-password
        # The volume is mounted at /var/lib/postgresql/data, and initdb refuses
        # a directory that is not empty — a mount point often has a lost+found.
        # Keeping the cluster in a subdirectory avoids that.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgresql
          containerPort: 5432
          protocol: TCP
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}, "-d", {{ .Values.postgresql.database | quote }}]
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}, "-d", {{ .Values.postgresql.database | quote }}]
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        {{- with .Values.postgresql.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        {{- if $backup }}
        - name: {{ $dumpVolume }}
          mountPath: {{ $dumpDir }}
        {{- end }}
      {{- if not .Values.postgresql.persistence.enabled }}
      volumes:
      - name: data
        emptyDir: {}
      {{- end }}
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - {{ .Values.postgresql.persistence.accessMode }}
      {{- with .Values.postgresql.persistence.storageClass }}
      storageClassName: {{ . | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.postgresql.persistence.size | quote }}
  {{/*
  The dump volume holds one plain-text SQL file for the length of a backup.
  It shares the data volume's storage class and access mode — one database,
  one pod, one place to put both — and only its size is worth a value.

  Adding it changes volumeClaimTemplates, which Kubernetes will not let you
  edit on a StatefulSet that already exists: enabling backups on a running
  release means deleting the StatefulSet first, plainly rather than with
  --cascade=orphan (README, "Backups (Velero)"). The claims survive either
  way; an adopted pod does not get the new volume, it wedges the controller.
  */}}
  {{- if $backup }}
  - metadata:
      name: {{ $dumpVolume }}
    spec:
      accessModes:
      - {{ .Values.postgresql.persistence.accessMode }}
      {{- with .Values.postgresql.persistence.storageClass }}
      storageClassName: {{ . | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.velero.dump.size | quote }}
  {{- end }}
  {{- end }}
{{- end }}
