services:
  web:
    build:
      context: .
      args:
        # Baked into the image as the VERSION env var (shown on the About
        # modal). CI computes a git tag or short SHA; for a local build set it
        # with e.g. `VERSION=$(git describe --tags --exact-match 2>/dev/null \
        # || git rev-parse --short HEAD) docker compose build`. Defaults to dev.
        VERSION: ${VERSION:-dev}
    # Image name matches the one published to Docker Hub by the release
    # workflow (.github/workflows/release.yml). PRESENCE_TAG selects which tag
    # to run: leave it 'latest' (default) and `docker compose build` / `up
    # --build` to build locally, or set it to a released version (e.g. 1.3.0)
    # in .env and `docker compose pull` to run the published image without
    # building it.
    image: alanbchristie/presence:${PRESENCE_TAG:-latest}
    container_name: presence-web
    ports:
    # Bind the app's port to loopback by default so that, under the TLS profile,
    # the plain-HTTP app is not reachable from outside the host (Caddy still
    # reaches it over the Docker network, unaffected by this host binding).
    # For a plain-HTTP deployment that must accept external traffic, set
    # PRESENCE_WEB_BIND=0.0.0.0 — but prefer the TLS profile instead.
    - "${PRESENCE_WEB_BIND:-127.0.0.1}:8000:8000"
    environment:
      PRESENCE_DB_PATH: /data/db.sqlite3
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1],${PRESENCE_DOMAIN:-}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://${PRESENCE_DOMAIN:-localhost},http://${PRESENCE_DOMAIN:-localhost}"
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-info@example.com}
      # No default: a superuser is created only when this is set (entrypoint.sh
      # skips creation otherwise), so there is no built-in admin/admin login.
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      PRESENCE_SERVER: ${PRESENCE_SERVER:-runserver}
      W3W_API_KEY: ${W3W_API_KEY:-}
    volumes:
    - presence-data:/data
    restart: unless-stopped

  caddy:
    profiles:
    - "tls"
    image: caddy:2-alpine
    container_name: presence-caddy
    restart: unless-stopped
    ports:
    - "80:80"
    - "443:443"
    - "443:443/udp"
    environment:
      PRESENCE_DOMAIN: ${PRESENCE_DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-me@example.com}
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy-data:/data
    - caddy-config:/config
    depends_on:
    - web

volumes:
  presence-data:
  caddy-data:
  caddy-config:
