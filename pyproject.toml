[project]
name = "presence"
version = "1.0.1"
description = "Django app that simulates on/off presence within a daily window."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alan B. Christie"}]
requires-python = ">=3.14"
dependencies = [
    "astral>=3.2",
    "django>=6.0,<7.0",
    "gunicorn>=26.0.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "httpie>=3.2.4",
    {include-group = "test"},
]
test = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "presence_site.settings_test"
python_files = ["test_*.py"]
testpaths = ["presence"]
addopts = "-ra"
