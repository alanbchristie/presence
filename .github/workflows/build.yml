name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  docker-build:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          # Full history + tags so `git describe` can resolve a tagged build.
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          version="$(git describe --tags --exact-match 2>/dev/null \
            || git rev-parse --short HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building VERSION=$version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: presence:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image (django check + version)
        run: |
          # Settings fail closed without a secret key when DEBUG is off (the
          # default), so supply a throwaway one for this production-mode check.
          docker run --rm -e DJANGO_SECRET_KEY=ci-smoke-test-not-a-real-secret \
            presence:ci \
            python manage.py check
          baked="$(docker run --rm presence:ci printenv VERSION)"
          echo "Image VERSION=$baked"
          test "$baked" = "${{ steps.version.outputs.version }}"

  tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        # W3W_API_KEY enables the live What3Words tests (test_w3w_live.py);
        # they skip when the secret is unavailable (e.g. a fork's PR).
        env:
          W3W_API_KEY: ${{ secrets.W3W_API_KEY }}
        run: uv run pytest -q --cov=presence --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
