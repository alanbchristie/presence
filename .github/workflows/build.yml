name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  docker-build:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          # Full history + tags so `git describe` can resolve a tagged build.
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          version="$(git describe --tags --exact-match 2>/dev/null \
            || git rev-parse --short HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building VERSION=$version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: presence:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image (django check + version)
        run: |
          # Settings fail closed without a secret key when DEBUG is off (the
          # default), so supply a throwaway one for this production-mode check.
          docker run --rm -e DJANGO_SECRET_KEY=ci-smoke-test-not-a-real-secret \
            presence:ci \
            python manage.py check
          baked="$(docker run --rm presence:ci printenv VERSION)"
          echo "Image VERSION=$baked"
          test "$baked" = "${{ steps.version.outputs.version }}"

  tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          # Tags, so test_helm_chart.py can check the chart's default image
          # tag against the newest release rather than skipping.
          fetch-depth: 0

      - name: Install uv
        # Pinned to a full version: setup-uv publishes no moving `v8` major
        # tag (only v8.x.y), unlike the other actions here.
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"

      - name: Install helm
        # test_helm_chart.py renders helm/presence and asserts the deployment
        # invariants; without helm on PATH the whole module skips silently.
        uses: azure/setup-helm@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        # W3W_API_KEY enables the live What3Words tests (test_w3w_live.py);
        # they skip when the secret is unavailable (e.g. a fork's PR).
        env:
          W3W_API_KEY: ${{ secrets.W3W_API_KEY }}
        run: uv run pytest -q --cov=presence --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  helm:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install helm
        uses: azure/setup-helm@v4

      - name: Lint the chart
        # --kube-version because the chart declares a floor of 1.36 and helm's
        # built-in default is older, which lint would otherwise reject.
        # image.tag has no default and is required, so every render supplies
        # one; the value is arbitrary, nothing here pulls the image.
        run: helm lint helm/presence --kube-version 1.36.0
             --set django.secretKey=ci-lint-not-a-real-secret
             --set image.tag=0.0.0-ci

      - name: Install kubeconform
        # Validates rendered manifests against the real Kubernetes schemas
        # without needing a cluster (unlike `kubectl --dry-run`).
        run: |
          curl -sSL \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Render and validate every value permutation
        # The chart's branches — bundled vs external database, ingress on/off,
        # own vs existing Secret — each render different objects, so validate
        # them all rather than only the defaults.
        run: |
          set -euo pipefail
          key="--set django.secretKey=ci-render-not-a-real-secret"
          declare -a cases=(
            "$key"
            "$key --set postgresql.persistence.enabled=false"
            "$key --set ingress.enabled=true --set ingress.tls.enabled=true --set ingress.tls.secretName=presence-tls"
            "$key --set django.superuser.password=ci-not-a-real-password --set w3w.apiKey=ci-not-a-real-key"
            "$key --set postgresql.enabled=false --set externalDatabase.host=db.example --set externalDatabase.password=ci-not-a-real-password"
            "--set django.existingSecret=presence-secret"
            "$key --set nodeSelector.kubernetes\\.io/arch=arm64"
            "$key --set ingress.enabled=true --set compression.enabled=true"
            "$key --set velero.fileSystemBackup=true"
          )
          # The compression case renders a Traefik CRD, which the built-in
          # schemas do not cover. The CRDs-catalog location supplies it, so
          # it is validated properly rather than skipped with
          # -ignore-missing-schemas (which would also hide a typo'd core kind).
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          # image.tag is required and has no default, so it belongs on every
          # case rather than in each entry above. The value is arbitrary —
          # nothing here pulls the image.
          tag="--set image.tag=0.0.0-ci"
          for case in "${cases[@]}"; do
            echo "::group::helm template $case"
            # shellcheck disable=SC2086
            helm template presence helm/presence --kube-version 1.36.0 $tag $case \
              | kubeconform -strict -summary -kubernetes-version 1.36.0 \
                  -schema-location default -schema-location "$crds" -
            echo "::endgroup::"
          done
