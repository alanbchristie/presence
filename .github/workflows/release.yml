name: release

on:
  release:
    types: ["published"]
  workflow_dispatch:

jobs:
  publish:
    name: Build and push image to Docker Hub
    runs-on: ubuntu-latest
    # Skip entirely unless Docker Hub is configured. DOCKERHUB_USERNAME is a
    # repository variable (not a secret) so it can gate the job here — secrets
    # cannot be referenced in a job-level `if`. With it unset the job is a
    # no-op, so forks without Docker Hub credentials publish nothing.
    if: vars.DOCKERHUB_USERNAME != ''
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          # Full history + tags so `git describe` can resolve a tagged build.
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          version="$(git describe --tags --exact-match 2>/dev/null \
            || git rev-parse --short HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building VERSION=$version"

      - name: Compute image tags
        id: tags
        run: |
          image="${{ vars.DOCKERHUB_USERNAME }}/presence"
          version="${{ steps.version.outputs.version }}"
          tags="${image}:${version}"
          # Only a real published release moves the :latest tag; a manual
          # workflow_dispatch build publishes just the version tag.
          if [ "${{ github.event_name }}" = "release" ]; then
            tags="${tags},${image}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Publishing tags: $tags"

      # QEMU lets the amd64 runner emulate arm64 for the multi-arch build.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
