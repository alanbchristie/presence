<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Presence{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 2rem auto;
      max-width: 48rem;
      padding: 0 1rem;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    .hint { color: #888; font-size: 0.85rem; margin-top: 0; }

    /* Common header (username + logout) */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
      font-size: 0.85rem;
      color: #888;
      border-bottom: 1px solid #8884;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    .site-header .user { font-weight: 600; color: inherit; }
    .site-header form { margin: 0; }
    .site-header button {
      font: inherit;
      cursor: pointer;
      color: inherit;
      background: none;
      border: 1px solid #8888;
      border-radius: 0.35rem;
      padding: 0.2rem 0.6rem;
    }
    .site-header button:hover { border-color: #888; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% if user.is_authenticated %}
  <div class="site-header">
    <span class="user">{{ user.get_username }}</span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">Log out</button>
    </form>
  </div>
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
