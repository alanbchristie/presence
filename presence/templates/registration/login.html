{% extends "base.html" %}

{% block title %}Log in &mdash; Presence{% endblock %}

{% block extra_head %}
  <style>
    .login { max-width: 22rem; margin-top: 2rem; }
    .login p { margin: 0 0 1rem; }
    .login label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 0.2rem; }
    .login input { width: 100%; box-sizing: border-box; font: inherit; padding: 0.4rem 0.5rem; }
    .login button {
      font: inherit;
      cursor: pointer;
      margin-top: 0.5rem;
      padding: 0.4rem 1rem;
      border: 1px solid #8888;
      border-radius: 0.35rem;
      background: none;
      color: inherit;
    }
    .login button:hover { border-color: #888; }
    .errors { color: #ff4136; font-size: 0.85rem; margin-bottom: 1rem; }
  </style>
{% endblock %}

{% block content %}
  <h1>Log in</h1>

  {% if form.errors %}
  <p class="errors">Your username and password didn't match. Please try again.</p>
  {% endif %}

  <form class="login" method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
{% endblock %}
