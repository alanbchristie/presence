{% extends "base.html" %}

{% block title %}Edit {{ key.name }} &mdash; Access keys{% endblock %}

{% block content %}
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{% url 'access_key_index' %}" class="link-secondary text-decoration-none">Access keys</a></li>
      <li class="breadcrumb-item"><a href="{% url 'access_key_detail' key.pk %}" class="link-secondary text-decoration-none">{{ key.name }}</a></li>
      <li class="breadcrumb-item active" aria-current="page">Edit</li>
    </ol>
  </nav>

  <h1 class="h3 mb-3">Edit {{ key.name }}</h1>

  <form method="post" action="{% url 'access_key_edit' key.pk %}" novalidate>
    {% csrf_token %}
    {% include "presence/_form_fields.html" %}
    <div class="d-flex gap-2">
      <a href="{% url 'access_key_detail' key.pk %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
{% endblock %}
