{% extends "base.html" %}

{% block title %}Edit {{ location.name }} &mdash; Locations{% endblock %}

{% block content %}
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{% url 'location_index' %}" class="link-secondary text-decoration-none">Locations</a></li>
      <li class="breadcrumb-item"><a href="{% url 'location_detail' location.pk %}" class="link-secondary text-decoration-none">{{ location.name }}</a></li>
      <li class="breadcrumb-item active" aria-current="page">Edit</li>
    </ol>
  </nav>

  <h1 class="h3 mb-3">Edit {{ location.name }}</h1>

  <form method="post" action="{% url 'location_edit' location.pk %}" novalidate>
    {% csrf_token %}
    {% include "presence/_form_fields.html" %}
    <div class="d-flex gap-2">
      <a href="{% url 'location_detail' location.pk %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
{% endblock %}
