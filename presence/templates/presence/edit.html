{% extends "base.html" %}

{% block title %}Edit {{ presence.name }} &mdash; Presence{% endblock %}

{% block content %}
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{% url 'index' %}" class="link-secondary text-decoration-none">Presence</a></li>
      <li class="breadcrumb-item"><a href="{% url 'detail' presence.identifier %}" class="link-secondary text-decoration-none">{{ presence.identifier }}</a></li>
      <li class="breadcrumb-item active" aria-current="page">Edit</li>
    </ol>
  </nav>

  <h1 class="h3 mb-3">Edit {{ presence.name }}</h1>

  <form method="post" action="{% url 'edit' presence.identifier %}" novalidate>
    {% csrf_token %}
    {% include "presence/_form_fields.html" %}
    <div class="d-flex gap-2">
      <a href="{% url 'detail' presence.identifier %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
{% endblock %}
